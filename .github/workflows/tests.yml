name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  phpunit:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [8.1, 8.2, 8.3, 8.4]

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup PHP based on matrix
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      # Install dependencies (no composer.lock needed)
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      # Run PHPUnit in readable format
      - name: Run PHPUnit
        run: vendor/bin/phpunit --testdox --colors=always
