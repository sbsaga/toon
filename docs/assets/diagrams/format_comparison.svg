<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="toonBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00C9A7"/>
      <stop offset="100%" stop-color="#00D4AA"/>
    </linearGradient>
    <linearGradient id="jsonCBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#FF8855"/>
    </linearGradient>
    <linearGradient id="yamlBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFD166"/>
      <stop offset="100%" stop-color="#FFE088"/>
    </linearGradient>
    <linearGradient id="jsonBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EF476F"/>
      <stop offset="100%" stop-color="#FF6B8A"/>
    </linearGradient>
    <linearGradient id="xmlBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B8FA3"/>
      <stop offset="100%" stop-color="#A0A4B8"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="12" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="400" y="45" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700">Token Efficiency Comparison</text>
  <text x="400" y="70" text-anchor="middle" fill="#8b8fa3" font-size="13">Fewer tokens = lower API cost &amp; faster LLM processing</text>

  <!-- Chart area -->
  <!-- TOON -->
  <text x="130" y="125" text-anchor="end" fill="#00C9A7" font-size="15" font-weight="600">TOON</text>
  <rect x="145" y="108" width="480" height="28" rx="6" fill="url(#toonBar)" filter="url(#shadow)"/>
  <text x="635" y="127" fill="#ffffff" font-size="13" font-weight="600">2,759 tokens</text>
  <rect x="145" y="108" width="480" height="28" rx="6" fill="none" stroke="#00FFD0" stroke-width="1" opacity="0.4"/>

  <!-- JSON Compact -->
  <text x="130" y="185" text-anchor="end" fill="#FF6B35" font-size="15" font-weight="600">JSON Compact</text>
  <rect x="145" y="168" width="540" height="28" rx="6" fill="url(#jsonCBar)" filter="url(#shadow)"/>
  <text x="695" y="187" fill="#ffffff" font-size="13" font-weight="600">3,104 tokens</text>

  <!-- YAML -->
  <text x="130" y="245" text-anchor="end" fill="#FFD166" font-size="15" font-weight="600">YAML</text>
  <rect x="145" y="228" width="580" height="28" rx="6" fill="url(#yamlBar)" filter="url(#shadow)"/>
  <text x="735" y="247" fill="#ffffff" font-size="13" font-weight="600">3,749 tokens</text>

  <!-- JSON Pretty -->
  <text x="130" y="305" text-anchor="end" fill="#EF476F" font-size="15" font-weight="600">JSON</text>
  <rect x="145" y="288" width="620" height="28" rx="6" fill="url(#jsonBar)" filter="url(#shadow)"/>
  <text x="775" y="307" fill="#ffffff" font-size="13" font-weight="600" text-anchor="end">4,587 tokens</text>

  <!-- XML -->
  <text x="130" y="365" text-anchor="end" fill="#8B8FA3" font-size="15" font-weight="600">XML</text>
  <rect x="145" y="348" width="650" height="28" rx="6" fill="url(#xmlBar)" filter="url(#shadow)"/>
  <text x="775" y="367" fill="#ffffff" font-size="13" font-weight="600" text-anchor="end">5,221 tokens</text>

  <!-- Winner badge -->
  <rect x="250" y="410" width="300" height="45" rx="22" fill="#00C9A7" opacity="0.15" stroke="#00C9A7" stroke-width="1"/>
  <text x="400" y="437" text-anchor="middle" fill="#00D4AA" font-size="15" font-weight="700">🏆 TOON: ~40% fewer tokens vs JSON</text>

  <!-- Accuracy note -->
  <text x="400" y="480" text-anchor="middle" fill="#6b6f83" font-size="11">Based on mixed-structure benchmarks across 4 LLMs (209 questions) · Source: toon-format/toon</text>
</svg>
