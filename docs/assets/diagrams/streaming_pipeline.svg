<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="stSh"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/></filter>
  </defs>

  <rect width="800" height="340" rx="12" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="700">Streaming Pipeline</text>
  <text x="400" y="55" text-anchor="middle" fill="#8b8fa3" font-size="12">Line-by-line TOON processing for large payloads</text>

  <!-- Encode Pipeline -->
  <text x="60" y="90" fill="#ffffff" font-size="14" font-weight="600">Encode Stream</text>

  <rect x="60" y="100" width="140" height="60" rx="8" fill="#4361EE" filter="url(#stSh)"/>
  <text x="130" y="125" text-anchor="middle" fill="#fff" font-size="20">📦</text>
  <text x="130" y="148" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">PHP Array</text>

  <line x1="200" y1="130" x2="240" y2="130" stroke="#4361EE" stroke-width="2"/>
  <polygon points="243,130 233,125 233,135" fill="#4361EE"/>

  <rect x="245" y="100" width="160" height="60" rx="8" fill="#EF476F" filter="url(#stSh)"/>
  <text x="325" y="125" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">Toon::encodeLines()</text>
  <text x="325" y="145" text-anchor="middle" fill="#ffffffaa" font-size="10">Generator&lt;string&gt;</text>

  <line x1="405" y1="130" x2="445" y2="130" stroke="#EF476F" stroke-width="2"/>
  <polygon points="448,130 438,125 438,135" fill="#EF476F"/>

  <rect x="450" y="100" width="140" height="60" rx="8" fill="#00C9A7" filter="url(#stSh)"/>
  <text x="520" y="120" text-anchor="middle" fill="#fff" font-size="10" font-family="'Consolas', monospace">project: TOON</text>
  <text x="520" y="134" text-anchor="middle" fill="#fff" font-size="10" font-family="'Consolas', monospace">users:</text>
  <text x="520" y="148" text-anchor="middle" fill="#fff" font-size="10" font-family="'Consolas', monospace">  items[2]{..}:</text>

  <line x1="590" y1="130" x2="630" y2="130" stroke="#00C9A7" stroke-width="2"/>
  <polygon points="633,130 623,125 623,135" fill="#00C9A7"/>

  <rect x="635" y="100" width="130" height="60" rx="8" fill="#7B2FF7" filter="url(#stSh)"/>
  <text x="700" y="125" text-anchor="middle" fill="#fff" font-size="20">📡</text>
  <text x="700" y="148" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">Stream/Socket</text>

  <!-- Decode Pipeline -->
  <text x="60" y="200" fill="#ffffff" font-size="14" font-weight="600">Decode Stream</text>

  <rect x="60" y="210" width="140" height="60" rx="8" fill="#7B2FF7" filter="url(#stSh)"/>
  <text x="130" y="235" text-anchor="middle" fill="#fff" font-size="20">📡</text>
  <text x="130" y="258" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">Line Source</text>

  <line x1="200" y1="240" x2="240" y2="240" stroke="#7B2FF7" stroke-width="2"/>
  <polygon points="243,240 233,235 233,245" fill="#7B2FF7"/>

  <rect x="245" y="210" width="180" height="60" rx="8" fill="#FF6B35" filter="url(#stSh)"/>
  <text x="335" y="235" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">Toon::decodeFromLines()</text>
  <text x="335" y="255" text-anchor="middle" fill="#ffffffaa" font-size="10">iterable → array</text>

  <line x1="425" y1="240" x2="465" y2="240" stroke="#FF6B35" stroke-width="2"/>
  <polygon points="468,240 458,235 458,245" fill="#FF6B35"/>

  <rect x="470" y="210" width="140" height="60" rx="8" fill="#4361EE" filter="url(#stSh)"/>
  <text x="540" y="235" text-anchor="middle" fill="#fff" font-size="20">📦</text>
  <text x="540" y="258" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">PHP Array</text>

  <!-- Helper note -->
  <rect x="150" y="290" width="500" height="30" rx="6" fill="#0d0d1a" stroke="#333" stroke-width="1"/>
  <text x="400" y="310" text-anchor="middle" fill="#FFD166" font-size="11" font-family="'Consolas', monospace">$lines = toon_encode_lines($payload); // Helper shortcut</text>

  <!-- Brand -->
  <circle cx="760" cy="325" r="10" fill="#EF476F" opacity="0.2"/>
  <text x="760" y="329" text-anchor="middle" fill="#EF476F" font-size="8" font-weight="700">T</text>
</svg>
