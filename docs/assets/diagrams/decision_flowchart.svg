<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="gToon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00C9A7"/>
      <stop offset="100%" stop-color="#00A88D"/>
    </linearGradient>
    <linearGradient id="gJson" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EF476F"/>
      <stop offset="100%" stop-color="#D63A5C"/>
    </linearGradient>
    <linearGradient id="gCsv" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD166"/>
      <stop offset="100%" stop-color="#E6B84D"/>
    </linearGradient>
    <linearGradient id="gQ" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4361EE"/>
      <stop offset="100%" stop-color="#3A56D4"/>
    </linearGradient>
    <filter id="glow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="620" rx="12" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700">When Should You Use TOON?</text>
  <text x="400" y="62" text-anchor="middle" fill="#8b8fa3" font-size="13">Decision flowchart for choosing the right format</text>

  <!-- Start node -->
  <rect x="300" y="85" width="200" height="40" rx="20" fill="#6C63FF" filter="url(#glow)"/>
  <text x="400" y="110" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">Your Data Payload</text>

  <!-- Arrow down -->
  <line x1="400" y1="125" x2="400" y2="155" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>
  <polygon points="400,158 395,148 405,148" fill="#555"/>

  <!-- Q1: External API? -->
  <rect x="260" y="160" width="280" height="45" rx="8" fill="url(#gQ)" filter="url(#glow)"/>
  <text x="400" y="187" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">Is it for an external/public API?</text>

  <!-- Q1 Yes → JSON -->
  <line x1="540" y1="182" x2="620" y2="182" stroke="#EF476F" stroke-width="2"/>
  <text x="570" y="175" fill="#EF476F" font-size="11" font-weight="700">YES</text>
  <rect x="620" y="162" width="140" height="42" rx="8" fill="url(#gJson)" filter="url(#glow)"/>
  <text x="690" y="180" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">Use JSON</text>
  <text x="690" y="196" text-anchor="middle" fill="#ffffffaa" font-size="10">Standard transport</text>

  <!-- Q1 No arrow -->
  <line x1="400" y1="205" x2="400" y2="235" stroke="#555" stroke-width="2"/>
  <text x="410" y="222" fill="#00C9A7" font-size="11" font-weight="700">NO</text>
  <polygon points="400,238 395,228 405,228" fill="#555"/>

  <!-- Q2: Flat tabular only? -->
  <rect x="260" y="240" width="280" height="45" rx="8" fill="url(#gQ)" filter="url(#glow)"/>
  <text x="400" y="267" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">Is data purely flat/tabular?</text>

  <!-- Q2 Yes → CSV -->
  <line x1="540" y1="262" x2="620" y2="262" stroke="#FFD166" stroke-width="2"/>
  <text x="570" y="255" fill="#FFD166" font-size="11" font-weight="700">YES</text>
  <rect x="620" y="242" width="140" height="42" rx="8" fill="url(#gCsv)" filter="url(#glow)"/>
  <text x="690" y="260" text-anchor="middle" fill="#1a1a2e" font-size="13" font-weight="700">Use CSV</text>
  <text x="690" y="276" text-anchor="middle" fill="#1a1a2eaa" font-size="10">Most compact flat</text>

  <!-- Q2 No arrow -->
  <line x1="400" y1="285" x2="400" y2="315" stroke="#555" stroke-width="2"/>
  <text x="410" y="302" fill="#00C9A7" font-size="11" font-weight="700">NO</text>
  <polygon points="400,318 395,308 405,308" fill="#555"/>

  <!-- Q3: Repeated object structures? -->
  <rect x="260" y="320" width="280" height="45" rx="8" fill="url(#gQ)" filter="url(#glow)"/>
  <text x="400" y="347" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">Repeated object structures?</text>

  <!-- Q3 No → JSON -->
  <line x1="540" y1="342" x2="620" y2="342" stroke="#EF476F" stroke-width="2"/>
  <text x="570" y="335" fill="#EF476F" font-size="11" font-weight="700">NO</text>
  <rect x="620" y="322" width="140" height="42" rx="8" fill="url(#gJson)" filter="url(#glow)"/>
  <text x="690" y="340" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">Use JSON</text>
  <text x="690" y="356" text-anchor="middle" fill="#ffffffaa" font-size="10">Deep/irregular data</text>

  <!-- Q3 Yes arrow -->
  <line x1="400" y1="365" x2="400" y2="395" stroke="#555" stroke-width="2"/>
  <text x="410" y="382" fill="#00C9A7" font-size="11" font-weight="700">YES</text>
  <polygon points="400,398 395,388 405,388" fill="#555"/>

  <!-- Q4: Token budget matters? -->
  <rect x="260" y="400" width="280" height="45" rx="8" fill="url(#gQ)" filter="url(#glow)"/>
  <text x="400" y="420" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Token budget or readability matters?</text>
  <text x="400" y="436" text-anchor="middle" fill="#ffffffbb" font-size="11">(prompts, logs, fixtures, exports)</text>

  <!-- Q4 Yes → TOON! -->
  <line x1="400" y1="445" x2="400" y2="475" stroke="#00C9A7" stroke-width="3"/>
  <text x="410" y="462" fill="#00C9A7" font-size="11" font-weight="700">YES</text>
  <polygon points="400,478 393,465 407,465" fill="#00C9A7"/>

  <!-- TOON result -->
  <rect x="280" y="480" width="240" height="55" rx="12" fill="url(#gToon)" filter="url(#glow)" stroke="#00FFD0" stroke-width="1"/>
  <text x="400" y="505" text-anchor="middle" fill="#fff" font-size="17" font-weight="800">✅ Use TOON</text>
  <text x="400" y="524" text-anchor="middle" fill="#ffffffcc" font-size="12">43% fewer chars, readable</text>

  <!-- Q4 No → JSON -->
  <line x1="540" y1="422" x2="620" y2="422" stroke="#EF476F" stroke-width="2"/>
  <text x="570" y="415" fill="#EF476F" font-size="11" font-weight="700">NO</text>
  <rect x="620" y="402" width="140" height="42" rx="8" fill="url(#gJson)" filter="url(#glow)"/>
  <text x="690" y="420" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">Use JSON</text>
  <text x="690" y="436" text-anchor="middle" fill="#ffffffaa" font-size="10">Default choice</text>

  <!-- Footer -->
  <text x="400" y="570" text-anchor="middle" fill="#6b6f83" font-size="11">TOON for Laravel · sbsaga/toon</text>

  <!-- Logo hint -->
  <circle cx="755" cy="580" r="15" fill="#EF476F" opacity="0.2"/>
  <text x="755" y="585" text-anchor="middle" fill="#EF476F" font-size="10" font-weight="700">T</text>
</svg>
