  <text x="565" y="332" fill="#FF6B35" font-size="10" font-family="'Consolas', monospace">toon:convert file --encode</text>

  <rect x="555" y="345" width="200" height="24" rx="4" fill="#0d0d1a"/>
  <text x="565" y="362" fill="#FF6B35" font-size="10" font-family="'Consolas', monospace">toon:convert file --decode</text>

  <rect x="555" y="375" width="200" height="24" rx="4" fill="#0d0d1a"/>
  <text x="565" y="392" fill="#FF6B35" font-size="10" font-family="'Consolas', monospace">--stats --strict --pretty</text>

  <!-- Legend -->
  <rect x="290" y="340" width="12" height="12" rx="2" fill="#00C9A7"/>
  <text x="310" y="351" fill="#8b8fa3" font-size="10">Core (stable since v1.0)</text>

  <rect x="290" y="360" width="12" height="12" rx="2" fill="#FFD166"/>
  <text x="310" y="371" fill="#8b8fa3" font-size="10">New in v1.3+ (opt‑in)</text>

  <rect x="290" y="380" width="12" height="12" rx="2" fill="#8b8fa3"/>
  <text x="310" y="391" fill="#8b8fa3" font-size="10">Utility / meta</text>

