<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="aSh"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/></filter>
  </defs>

  <rect width="800" height="480" rx="12" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="700">Complete API Quick Reference</text>
  <text x="400" y="58" text-anchor="middle" fill="#8b8fa3" font-size="12">All public methods and helpers at a glance</text>

  <!-- Facade column -->
  <rect x="30" y="75" width="240" height="380" rx="10" fill="#EF476F" opacity="0.08" stroke="#EF476F" stroke-width="1"/>
  <text x="150" y="100" text-anchor="middle" fill="#EF476F" font-size="14" font-weight="700">🏛️ Toon Facade</text>

  <rect x="45" y="112" width="210" height="24" rx="4" fill="#0d0d1a"/>
  <text x="55" y="129" fill="#00C9A7" font-size="11" font-family="'Consolas', monospace">Toon::encode($data)</text>

  <rect x="45" y="142" width="210" height="24" rx="4" fill="#0d0d1a"/>
  <text x="55" y="159" fill="#00C9A7" font-size="11" font-family="'Consolas', monospace">Toon::decode($toon)</text>

  <rect x="45" y="172" width="210" height="24" rx="4" fill="#0d0d1a"/>
  <text x="55" y="189" fill="#FFD166" font-size="11" font-family="'Consolas', monospace">Toon::encodeWith($d, $fn)</text>

