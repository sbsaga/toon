  <text x="400" y="470" text-anchor="middle" fill="#6b6f83" font-size="11">📖 Full reference: docs/reference/ · sbsaga/toon</text>

  <!-- Brand -->
  <circle cx="760" cy="465" r="10" fill="#EF476F" opacity="0.2"/>
  <text x="760" y="469" text-anchor="middle" fill="#EF476F" font-size="8" font-weight="700">T</text>
