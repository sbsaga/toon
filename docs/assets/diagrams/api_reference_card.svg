  <rect x="555" y="112" width="200" height="24" rx="4" fill="#0d0d1a"/>
  <text x="565" y="129" fill="#7B2FF7" font-size="11" font-family="'Consolas', monospace">collect(..)->toToon()</text>

  <rect x="555" y="142" width="200" height="24" rx="4" fill="#0d0d1a"/>
  <text x="565" y="159" fill="#7B2FF7" font-size="11" font-family="'Consolas', monospace">use Toonable; // Trait</text>

  <rect x="555" y="172" width="200" height="24" rx="4" fill="#0d0d1a"/>
  <text x="565" y="189" fill="#7B2FF7" font-size="11" font-family="'Consolas', monospace">$model->toToon()</text>

  <rect x="555" y="202" width="200" height="24" rx="4" fill="#0d0d1a"/>
  <text x="565" y="219" fill="#7B2FF7" font-size="11" font-family="'Consolas', monospace">$model->toToonArray()</text>

  <rect x="555" y="232" width="200" height="24" rx="4" fill="#0d0d1a"/>
  <text x="565" y="249" fill="#7B2FF7" font-size="11" font-family="'Consolas', monospace">$model->toToonDiff()</text>

