<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="lSh"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/></filter>
  </defs>

  <rect width="800" height="380" rx="12" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="700">Laravel Service Architecture</text>
  <text x="400" y="55" text-anchor="middle" fill="#8b8fa3" font-size="12">How TOON integrates into the Laravel service container</text>

  <!-- Top Layer: Your App -->
  <rect x="50" y="75" width="700" height="65" rx="10" fill="#4361EE" opacity="0.15" stroke="#4361EE" stroke-width="1"/>
  <text x="400" y="93" text-anchor="middle" fill="#4361EE" font-size="13" font-weight="700">YOUR LARAVEL APPLICATION</text>

  <rect x="80" y="103" width="100" height="28" rx="6" fill="#4361EE" filter="url(#lSh)"/>
  <text x="130" y="122" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">Routes</text>

  <rect x="200" y="103" width="100" height="28" rx="6" fill="#4361EE" filter="url(#lSh)"/>
  <text x="250" y="122" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">Controllers</text>

  <rect x="320" y="103" width="100" height="28" rx="6" fill="#4361EE" filter="url(#lSh)"/>
  <text x="370" y="122" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">Jobs</text>

  <rect x="440" y="103" width="100" height="28" rx="6" fill="#4361EE" filter="url(#lSh)"/>
  <text x="490" y="122" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">Console</text>

  <rect x="560" y="103" width="150" height="28" rx="6" fill="#4361EE" filter="url(#lSh)"/>
  <text x="635" y="122" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">Service Classes</text>

  <!-- Arrow -->
  <line x1="400" y1="140" x2="400" y2="160" stroke="#555" stroke-width="2"/>
  <polygon points="400,163 395,153 405,153" fill="#555"/>

  <!-- Middle Layer: TOON Package -->
  <rect x="50" y="165" width="700" height="105" rx="10" fill="#EF476F" opacity="0.1" stroke="#EF476F" stroke-width="1"/>
  <text x="400" y="183" text-anchor="middle" fill="#EF476F" font-size="13" font-weight="700">TOON PACKAGE (sbsaga/toon)</text>

  <!-- Facade -->
  <rect x="70" y="195" width="120" height="60" rx="8" fill="#EF476F" filter="url(#lSh)"/>
  <text x="130" y="218" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">Toon Facade</text>
  <text x="130" y="235" text-anchor="middle" fill="#ffffffaa" font-size="9">encode() · decode()</text>
  <text x="130" y="248" text-anchor="middle" fill="#ffffffaa" font-size="9">diff() · validate()</text>

  <!-- Encoder -->
  <rect x="210" y="195" width="120" height="60" rx="8" fill="#FF6B35" filter="url(#lSh)"/>
  <text x="270" y="218" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">ToonConverter</text>
  <text x="270" y="235" text-anchor="middle" fill="#ffffffaa" font-size="9">toToon()</text>
  <text x="270" y="248" text-anchor="middle" fill="#ffffffaa" font-size="9">Tabular encoder</text>

  <!-- Decoder -->
  <rect x="350" y="195" width="120" height="60" rx="8" fill="#FFD166" filter="url(#lSh)"/>
  <text x="410" y="218" text-anchor="middle" fill="#1a1a2e" font-size="11" font-weight="700">ToonDecoder</text>
  <text x="410" y="235" text-anchor="middle" fill="#1a1a2eaa" font-size="9">fromToon()</text>
  <text x="410" y="248" text-anchor="middle" fill="#1a1a2eaa" font-size="9">Strict validation</text>

  <!-- Helpers -->
  <rect x="490" y="195" width="120" height="60" rx="8" fill="#00C9A7" filter="url(#lSh)"/>
  <text x="550" y="218" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">Helpers</text>
  <text x="550" y="235" text-anchor="middle" fill="#ffffffaa" font-size="9">toon_encode()</text>
  <text x="550" y="248" text-anchor="middle" fill="#ffffffaa" font-size="9">toon_decode()</text>

  <!-- Toonable -->
  <rect x="630" y="195" width="100" height="60" rx="8" fill="#7B2FF7" filter="url(#lSh)"/>
  <text x="680" y="218" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">Toonable</text>
  <text x="680" y="235" text-anchor="middle" fill="#ffffffaa" font-size="9">Trait for</text>
  <text x="680" y="248" text-anchor="middle" fill="#ffffffaa" font-size="9">Eloquent models</text>

  <!-- Arrow -->
  <line x1="400" y1="270" x2="400" y2="290" stroke="#555" stroke-width="2"/>
  <polygon points="400,293 395,283 405,283" fill="#555"/>

  <!-- Bottom Layer: Config -->
  <rect x="50" y="295" width="700" height="55" rx="10" fill="#00C9A7" opacity="0.1" stroke="#00C9A7" stroke-width="1"/>
  <text x="110" y="327" text-anchor="middle" fill="#00C9A7" font-size="12" font-weight="700">config/toon.php</text>

  <rect x="200" y="307" width="145" height="30" rx="6" fill="#0d0d1a" stroke="#333" stroke-width="1"/>
  <text x="272" y="326" text-anchor="middle" fill="#FFD166" font-size="10" font-family="'Consolas', monospace">compatibility_mode</text>

  <rect x="360" y="307" width="100" height="30" rx="6" fill="#0d0d1a" stroke="#333" stroke-width="1"/>
  <text x="410" y="326" text-anchor="middle" fill="#FFD166" font-size="10" font-family="'Consolas', monospace">delimiter</text>

  <rect x="475" y="307" width="110" height="30" rx="6" fill="#0d0d1a" stroke="#333" stroke-width="1"/>
  <text x="530" y="326" text-anchor="middle" fill="#FFD166" font-size="10" font-family="'Consolas', monospace">strict_mode</text>

  <rect x="600" y="307" width="130" height="30" rx="6" fill="#0d0d1a" stroke="#333" stroke-width="1"/>
  <text x="665" y="326" text-anchor="middle" fill="#FFD166" font-size="10" font-family="'Consolas', monospace">coerce_scalars</text>

  <!-- Footer -->
  <text x="400" y="375" text-anchor="middle" fill="#6b6f83" font-size="10">Auto-discovered via ToonServiceProvider · No manual registration required</text>

  <!-- Brand -->
  <image href="logo.webp" x="725" y="345" width="50" height="50" opacity="0.7"/>
</svg>
